apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/davsonrsss-devops/fiap-05-GitOps.git'
    targetRevision: HEAD
    path: manifests/frontend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: solidarytech
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
