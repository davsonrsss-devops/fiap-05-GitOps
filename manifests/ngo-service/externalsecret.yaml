apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ngo-service-es
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ngo-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: solidarytech/ngo-db
        property: DATABASE_URL
