apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: solidarytech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: 560985453529.dkr.ecr.us-east-1.amazonaws.com/solidarytech/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
