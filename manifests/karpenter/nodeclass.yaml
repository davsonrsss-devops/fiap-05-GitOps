apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: "KarpenterNodeRole-solidarytech-cluster"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "solidarytech-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "solidarytech-cluster"
  tags:
    Name: karpenter-node
    Environment: Production
